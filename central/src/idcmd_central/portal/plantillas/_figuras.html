{#- Figura del equipo: foto del modelo si el administrador la subió; si no, ilustración propia
    según la forma deducida de la referencia (portal/apariencia.py). El punto indica el estado. -#}
{% macro figura(forma, estado, foto=none, titulo='') %}
<span class="figura-marco fe-{{ estado or 'desconocido' }}" title="{{ titulo }}">
{% if foto %}<img class="figura foto" src="{{ foto }}" alt="" loading="lazy" decoding="async">
{% else %}<svg class="figura" viewBox="0 0 96 72" aria-hidden="true">
<ellipse class="f-s" cx="48" cy="66" rx="34" ry="4"/>
{% if forma == 'bala' %}
  <rect class="f-c" x="8" y="18" width="7" height="40" rx="2"/>
  <path class="f-c3" d="M15 42 h14 v7 h-14z"/>
  <rect class="f-c" x="26" y="26" width="52" height="24" rx="10"/>
  <path class="f-c2" d="M24 23 h60 a3 3 0 0 1 3 3 v3 h-63z"/>
  <ellipse class="f-o" cx="78" cy="38" rx="7" ry="11"/>
  <ellipse class="f-v" cx="79" cy="38" rx="4" ry="6.5"/>
  <circle class="f-brillo" cx="80.5" cy="35" r="1.4"/>
  <rect class="f-a" x="34" y="46" width="14" height="2.5" rx="1"/>
  <circle class="f-led" cx="36" cy="36" r="2.6"/>
{% elif forma == 'domo' %}
  <rect class="f-c" x="14" y="46" width="68" height="13" rx="6.5"/>
  <path class="f-cup" d="M22 48 A26 26 0 0 1 74 48 Z"/>
  <circle class="f-o" cx="48" cy="36" r="8"/>
  <circle class="f-v" cx="48" cy="36" r="4.5"/>
  <circle class="f-brillo" cx="46" cy="34" r="1.4"/>
  <path class="f-reflejo" d="M30 40 A20 20 0 0 1 42 25" />
  <rect class="f-a" x="20" y="54" width="12" height="2.5" rx="1"/>
  <circle class="f-led" cx="74" cy="52.5" r="2.4"/>
{% elif forma == 'torreta' %}
  <ellipse class="f-c3" cx="48" cy="56" rx="30" ry="7"/>
  <rect class="f-c" x="18" y="49" width="60" height="7" rx="3.5"/>
  <circle class="f-c" cx="48" cy="33" r="20"/>
  <circle class="f-o" cx="53" cy="35" r="11"/>
  <circle class="f-v" cx="53" cy="35" r="5.5"/>
  <circle class="f-brillo" cx="51" cy="33" r="1.5"/>
  <circle class="f-led" cx="34" cy="26" r="2.4"/>
{% elif forma == 'ptz' %}
  <rect class="f-c" x="43" y="3" width="10" height="13" rx="2"/>
  <rect class="f-c" x="28" y="14" width="40" height="24" rx="9"/>
  <path class="f-cup" d="M29 36 A19 19 0 0 0 67 36 Z"/>
  <circle class="f-o" cx="48" cy="45" r="7"/>
  <circle class="f-v" cx="48" cy="45" r="4"/>
  <circle class="f-brillo" cx="46.6" cy="43.6" r="1.2"/>
  <rect class="f-a" x="34" y="20" width="12" height="2.5" rx="1"/>
  <circle class="f-led" cx="60" cy="22" r="2.4"/>
{% elif forma == 'ojo_pez' %}
  <ellipse class="f-c3" cx="48" cy="50" rx="36" ry="10"/>
  <ellipse class="f-c" cx="48" cy="45" rx="36" ry="10"/>
  <ellipse class="f-cup" cx="48" cy="42" rx="14" ry="7"/>
  <ellipse class="f-v" cx="48" cy="42" rx="5" ry="3"/>
  <circle class="f-led" cx="76" cy="45" r="2.4"/>
{% elif forma == 'grabador' %}
  <path class="f-c2" d="M8 26 L20 14 L92 14 L80 26Z"/>
  <path class="f-c3" d="M80 26 L92 14 L92 42 L80 54Z"/>
  <rect class="f-c" x="8" y="26" width="72" height="28" rx="2"/>
  <rect class="f-o" x="40" y="32" width="34" height="5" rx="1"/>
  <rect class="f-o" x="40" y="41" width="34" height="5" rx="1"/>
  <rect class="f-a" x="14" y="47" width="16" height="2.5" rx="1"/>
  <circle class="f-led" cx="16" cy="34" r="2.6"/>
  <circle class="f-mini" cx="24" cy="34" r="1.6"/><circle class="f-mini" cx="30" cy="34" r="1.6"/>
{% elif forma == 'servidor' %}
  <path class="f-c2" d="M26 12 L36 4 L70 4 L60 12Z"/>
  <path class="f-c3" d="M60 12 L70 4 L70 56 L60 64Z"/>
  <rect class="f-c" x="26" y="12" width="34" height="52" rx="2"/>
  <rect class="f-o" x="31" y="18" width="24" height="4" rx="1"/>
  <rect class="f-o" x="31" y="25" width="24" height="4" rx="1"/>
  <rect class="f-o" x="31" y="32" width="24" height="4" rx="1"/>
  <rect class="f-a" x="31" y="56" width="10" height="2.5" rx="1"/>
  <circle class="f-led" cx="50" cy="56" r="2.4"/>
{% elif forma == 'panel' %}
  <rect class="f-c3" x="22" y="8" width="54" height="56" rx="3"/>
  <rect class="f-c" x="19" y="6" width="54" height="56" rx="3"/>
  <rect class="f-c2" x="25" y="12" width="42" height="44" rx="2"/>
  <rect class="f-o" x="31" y="18" width="30" height="14" rx="1.5"/>
  <circle class="f-led" cx="34" cy="25" r="2.4"/>
  <circle class="f-mini" cx="42" cy="25" r="1.6"/><circle class="f-mini" cx="48" cy="25" r="1.6"/>
  <path class="f-cerradura" d="M42 44 v-4 a4 4 0 0 1 8 0 v4"/>
  <rect class="f-o" x="40" y="43" width="12" height="9" rx="1.5"/>
  <rect class="f-a" x="25" y="58" width="16" height="2.5" rx="1"/>
{% elif forma == 'terminal' %}
  <rect class="f-c" x="28" y="4" width="40" height="60" rx="6"/>
  <rect class="f-o" x="32" y="10" width="32" height="34" rx="2"/>
  <circle class="f-cara" cx="48" cy="23" r="6"/>
  <path class="f-cara" d="M38 40 a10 8 0 0 1 20 0"/>
  <rect class="f-v" x="40" y="48" width="16" height="10" rx="2"/>
  <circle class="f-o" cx="48" cy="7" r="1.6"/>
  <circle class="f-led" cx="62" cy="58" r="2.4"/>
{% elif forma == 'lectora' %}
  <rect class="f-c" x="34" y="6" width="28" height="58" rx="6"/>
  <rect class="f-o" x="39" y="12" width="18" height="18" rx="2"/>
  <path class="f-cara" d="M43 21 a5 5 0 0 1 10 0 M45.5 21 a2.5 2.5 0 0 1 5 0"/>
  <rect class="f-c2" x="39" y="36" width="18" height="18" rx="2"/>
  <rect class="f-a" x="42" y="57" width="12" height="2.5" rx="1"/>
  <circle class="f-led" cx="48" cy="45" r="2.6"/>
{% elif forma == 'switch' %}
  <path class="f-c2" d="M6 32 L16 24 L92 24 L82 32Z"/>
  <path class="f-c3" d="M82 32 L92 24 L92 40 L82 48Z"/>
  <rect class="f-c" x="6" y="32" width="76" height="16" rx="2"/>
  {% for i in range(8) %}<rect class="f-o" x="{{ 24 + i * 7 }}" y="36" width="5" height="5" rx=".8"/>{% endfor %}
  <circle class="f-led" cx="13" cy="40" r="2.4"/>
{% elif forma == 'ups' %}
  <path class="f-c2" d="M24 14 L34 6 L74 6 L64 14Z"/>
  <path class="f-c3" d="M64 14 L74 6 L74 56 L64 64Z"/>
  <rect class="f-c" x="24" y="14" width="40" height="50" rx="3"/>
  <rect class="f-o" x="30" y="20" width="28" height="14" rx="1.5"/>
  <path class="f-rayo" d="M46 22 l-5 7 h4 l-2 4 l6 -7 h-4z"/>
  <rect class="f-a" x="30" y="55" width="12" height="2.5" rx="1"/>
  <circle class="f-led" cx="52" cy="42" r="2.6"/>
{% else %}
  <path class="f-c2" d="M18 22 L28 12 L80 12 L70 22Z"/>
  <path class="f-c3" d="M70 22 L80 12 L80 50 L70 60Z"/>
  <rect class="f-c" x="18" y="22" width="52" height="38" rx="3"/>
  <rect class="f-a" x="24" y="52" width="14" height="2.5" rx="1"/>
  <circle class="f-led" cx="60" cy="30" r="2.6"/>
{% endif %}
</svg>{% endif %}
<i class="figura-punto"></i></span>
{% endmacro %}
