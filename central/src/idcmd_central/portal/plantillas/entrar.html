{% extends "base.html" %}
{% block titulo %}Ingresar · IDtech Command{% endblock %}
{% block contenido %}
<div class="ingreso tarjeta">
  <h1>IDtech Command</h1>
  <div class="sub">Monitoreo de CCTV y control de acceso</div>
  {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/portal/entrar" autocomplete="on">
    <label for="correo">Correo</label>
    <input id="correo" name="correo" type="email" required autocomplete="username" autofocus>
    <label for="clave">Clave</label>
    <input id="clave" name="clave" type="password" required autocomplete="current-password">
    <label for="codigo">Código de verificación (aplicación de autenticación)</label>
    <input id="codigo" name="codigo" inputmode="numeric" pattern="[0-9 ]{6,7}" maxlength="7"
           required autocomplete="one-time-code">
    <button type="submit">Ingresar</button>
  </form>
</div>
{% endblock %}
