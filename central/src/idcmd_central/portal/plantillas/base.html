<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}IDtech Command{% endblock %}</title>
  <meta name="theme-color" content="#0b5cad">
  <link rel="manifest" href="/portal/manifest.webmanifest">
  <link rel="icon" href="/portal/estaticos/icono-192.png">
  <link rel="apple-touch-icon" href="/portal/estaticos/icono-192.png">
  <link rel="stylesheet" href="/portal/estaticos/portal.css">
  <script src="/portal/estaticos/htmx.min.js" defer></script>
  <script src="/portal/estaticos/campo.js" defer></script>
</head>
<body>
{% if usuario %}
<header class="barra">
  <a class="marca" href="/portal">IDtech Command</a>
  <nav class="principal">
    <a href="/portal">Sitios</a>
    <a href="/portal/tickets">Tickets</a>
    {% if usuario.rol == 'admin' %}<a href="/portal/avisos">Avisos</a>{% endif %}
  </nav>
  <span class="usuario">{{ usuario.nombre }} · {{ usuario.rol }}</span>
  <form method="post" action="/portal/salir"><button class="discreto" type="submit">Salir</button></form>
</header>
{% endif %}
<main>{% block contenido %}{% endblock %}</main>
</body>
</html>
