#!/usr/sbin/nft -f
# Firewall del mini PC del agente: ninguna conexión entrante; salidas mínimas.
# PLANTILLA: validar en el mini PC en la Etapa 5 antes de instalar en un sitio.
#
# Ajustar: subredes de equipos del cliente, IP de la central, DNS y NTP del cliente.
# No usar `flush ruleset`: borraría las reglas que Docker crea. Esta tabla es propia y
# convive con las de Docker; en nftables un paquete descartado por cualquier cadena base
# queda descartado.

define SUBREDES_EQUIPOS = { 192.168.10.0/24 }
define CENTRAL = { 192.0.2.10 }          # reemplazar por la IP pública de la central
define DNS_NTP = { 192.168.10.1 }

table inet idcmd
delete table inet idcmd

table inet idcmd {
  chain entrada {
    type filter hook input priority 0; policy drop;
    iif lo accept
    ct state established,related accept
    # Sin SSH por defecto. Soporte remoto solo con autorización escrita (Tailscale).
  }

  # Tráfico del propio host (actualizaciones del sistema, descarga de imágenes).
  chain salida {
    type filter hook output priority 0; policy drop;
    oif lo accept
    ct state established,related accept
    ip daddr $DNS_NTP udp dport { 53, 123 } accept
    tcp dport 443 accept
  }

  # Tráfico del contenedor del agente (pasa por forward, no por output).
  chain reenvio {
    type filter hook forward priority 0; policy drop;
    ct state established,related accept
    ip daddr $CENTRAL tcp dport 443 accept
    ip daddr $DNS_NTP udp dport { 53, 123 } accept
    ip daddr $SUBREDES_EQUIPOS accept
    # Si la red exige proxy, permitir solo el proxy en lugar de $CENTRAL.
  }
}
