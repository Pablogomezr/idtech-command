[project]
name = "idcmd-agente"
version = "0.1.0"
description = "Agente en sitio de IDtech Command: monitoreo de salud multimarca, solo lectura, conexión solo saliente."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7,<3",
    "httpx>=0.27,<1",
    "icmplib>=3.0,<4",
    "cryptography>=42",
    "pyyaml>=6",
]

[project.scripts]
idcmd = "idcmd_agente.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/idcmd_agente"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
